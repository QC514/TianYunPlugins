name: Update publicFileIndex

on:
  push:
    paths:
      - "plugins/**"
      - "scripts/generate_public_file_index.py"
      - ".github/workflows/update-public-file-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-file-index
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clear and regenerate publicFileIndex.json
        run: |
          set -euo pipefail
          # Always rebuild from scratch so old entries never linger.
          : > publicFileIndex.json
          python scripts/generate_public_file_index.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --force -- publicFileIndex.json

          if git diff --cached --quiet -- publicFileIndex.json; then
            echo "publicFileIndex.json unchanged"
            exit 0
          fi

          git commit -m "chore: update publicFileIndex.json"
          git push
